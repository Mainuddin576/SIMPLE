<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meri Pehli Webpage</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      color: #333;
      text-align: center;
    }

    header {
      background: #4a90e2;
      color: white;
      padding: 40px 20px;
    }

    header h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
    }

    main {
      max-width: 600px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .card h2 {
      margin-bottom: 10px;
    }

    button {
      margin-top: 16px;
      padding: 10px 24px;
      font-size: 1rem;
      color: white;
      background: #4a90e2;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #357abd;
    }

    footer {
      margin: 30px 0;
      font-size: 0.9rem;
      color: #777;
    }
  </style>
</head>
<body>

  <header>
    <h1>Namaste! 👋</h1>
    <p>Yeh meri pehli simple webpage hai</p>
  </header>

  <main>
    <div class="card">
      <h2>Mere Baare Me</h2>
      <p>Main HTML aur CSS seekh raha hoon. Yeh page bahut simple hai, lekin shuruaat yahin se hoti hai.</p>
      <button onclick="alert('Click karne ke liye shukriya!')">Click Karo</button>
    </div>
  </main>

  <footer>
    <p>Banaya gaya ❤️ ke saath</p>
  </footer>

</body>
</html>
